<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HAY</title>

    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: radial-gradient(circle at center, #1a0712 0%, #050505 65%, #000 100%);
            cursor: pointer;
            font-family: Arial, "Microsoft YaHei", sans-serif;
        }

        #text-tip {
            position: absolute;
            top: 10%;
            width: 100%;
            text-align: center;
            color: rgba(255, 255, 255, 0.75);
            font-size: 1.15rem;
            letter-spacing: 2px;
            pointer-events: none;
            user-select: none;
            transition: opacity 0.6s;
            z-index: 5;
        }

        #intro-message {
            position: absolute;
            top: 42%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: calc(100% - 48px);
            margin: 0;
            color: #fff0f6;
            font-family: "Songti SC", "STSong", "SimSun", serif;
            font-size: clamp(1.25rem, 3.8vw, 2rem);
            font-weight: 400;
            line-height: 2;
            letter-spacing: 0.14em;
            text-align: center;
            text-shadow: 0 0 28px rgba(255, 120, 180, 0.3);
            pointer-events: none;
            user-select: none;
            opacity: 1;
            transition: opacity 1.2s ease;
            z-index: 5;
        }

        #intro-message.is-leaving {
            opacity: 0;
        }

        @media (prefers-reduced-motion: reduce) {
            #intro-message {
                transition: none;
            }
        }

        #start-btn {
            position: absolute;
            left: 50%;
            top: calc(42% + 7rem);
            transform: translate(-50%, -50%);
            z-index: 10;
            padding: 14px 30px;
            border: 1px solid rgba(255, 255, 255, 0.35);
            border-radius: 999px;
            background: rgba(255, 80, 150, 0.25);
            color: white;
            font-size: 1rem;
            letter-spacing: 2px;
            backdrop-filter: blur(8px);
            cursor: pointer;
            box-shadow: 0 0 30px rgba(255, 60, 150, 0.4);
        }

        #start-btn:hover {
            background: rgba(255, 80, 150, 0.42);
        }

        #meeting-scene {
            --meet-offset: clamp(52px, 13vw, 94px);
            position: fixed;
            inset: 0;
            z-index: 6;
            overflow: hidden;
            pointer-events: none;
            opacity: 0;
            transition: opacity 1s ease;
        }
        #meeting-scene[hidden] { display: none; }
        #meeting-scene.is-active { opacity: 1; }
        #meeting-scene.is-leaving { opacity: 0; }

        .meeting-title {
            position: absolute;
            top: clamp(28px, 11vh, 88px);
            left: 50%;
            width: calc(100% - 36px);
            margin: 0;
            transform: translateX(-50%);
            color: #f5d9ee;
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
            font-size: clamp(20px, 3vw, 30px);
            font-weight: 500;
            line-height: 1.65;
            letter-spacing: 0.06em;
            text-align: center;
            text-shadow: 0 0 24px #e599ce45;
        }
        .meeting-title span {
            display: inline-block;
            margin-left: 0.35em;
            color: #cbb4ed;
            font-family: Georgia, serif;
            font-weight: 400;
            font-style: italic;
            letter-spacing: 0.02em;
        }
        .meeting-title::after {
            content: "";
            display: block;
            width: 42px;
            height: 1px;
            margin: 13px auto 0;
            background: linear-gradient(90deg, transparent, #e8b5d5a0, transparent);
        }
        .meeting-glow {
            position: absolute;
            left: 50%;
            top: 61%;
            width: min(100vw, 800px);
            height: 420px;
            transform: translate(-50%, -50%);
            background: radial-gradient(ellipse at 32% 48%, #a173d824, transparent 58%), radial-gradient(ellipse at 68% 48%, #db79ae24, transparent 58%);
        }
        .meeting-ground {
            position: absolute;
            left: 50%;
            bottom: calc(18% + 1px);
            width: min(80vw, 600px);
            height: 1px;
            transform: translateX(-50%);
            background: linear-gradient(90deg, transparent, #e1afd04d, transparent);
        }
        .walker {
            position: absolute;
            bottom: 18%;
            left: 50%;
            width: clamp(86px, 16.8vw, 134px);
            transform: translateX(var(--entry-x));
        }
        .walker-boy {
            --entry-x: calc(-50vw - 180px);
            --target-x: calc(-50% - var(--meet-offset));
        }
        .walker-girl {
            --entry-x: calc(50vw + 30px);
            --target-x: calc(-50% + var(--meet-offset));
        }
        .is-active .walker { animation: meet-walk 3.8s linear forwards; }
        .character {
            display: block;
            width: 100%;
            height: auto;
            overflow: visible;
            filter: drop-shadow(0 0 13px #bd80d338);
        }
        .walker-girl .character { filter: drop-shadow(0 0 13px #e084be38); }
        .character-shadow {
            position: absolute;
            bottom: 0;
            left: 13%;
            width: 74%;
            height: 12px;
            border-radius: 50%;
            background: #b89ae842;
            filter: blur(6px);
        }
        .walker-girl .character-shadow { background: #dc92bc42; }
        .is-active:not(.has-met) .character { animation: walk-bob 0.5s ease-in-out infinite; }
        .leg, .arm { transform-box: view-box; }
        .leg { transform-origin: 80px 171px; }
        .arm { transform-origin: 80px 132px; }
        .is-active:not(.has-met) .leg-back { animation: step 0.5s ease-in-out infinite; }
        .is-active:not(.has-met) .leg-front { animation: step 0.5s ease-in-out -0.25s infinite; }
        .is-active:not(.has-met) .arm-back { animation: arm-swing 0.5s ease-in-out -0.25s infinite; }
        .is-active:not(.has-met) .arm-front { animation: arm-swing 0.5s ease-in-out infinite; }
        .walker-girl .character { animation-delay: -0.16s !important; }
        .character-eyes {
            transform-box: fill-box;
            transform-origin: center;
            animation: soft-blink 5.2s ease-in-out infinite;
        }
        .walker-girl .character-eyes { animation-delay: -1.7s; }
        .has-met .character { animation: gentle-breathe 3.2s ease-in-out infinite; }

        .speech {
            position: absolute;
            bottom: calc(100% + 18px);
            left: 50%;
            box-sizing: border-box;
            width: clamp(176px, 24vw, 250px);
            padding: 16px 20px;
            border: 1px solid #c9a5f26b;
            border-radius: 23px 23px 23px 8px;
            margin: 0;
            color: #f3e8ff;
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
            font-size: clamp(14px, 1.5vw, 17px);
            line-height: 1.75;
            text-align: left;
            letter-spacing: 0.02em;
            background: #35233ff5;
            backdrop-filter: blur(12px);
            box-shadow: 0 0 28px #b677df14, inset 0 1px #ffffff08;
            opacity: 0;
            visibility: hidden;
            transform: translate(-68%, 10px) scale(0.94);
            transform-origin: 68% 100%;
            transition: opacity 0.65s ease, transform 0.65s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .speech::after {
            content: "";
            position: absolute;
            bottom: -9px;
            left: 66%;
            width: 16px;
            height: 16px;
            border-right: 1px solid #c9a5f26b;
            border-bottom: 1px solid #c9a5f26b;
            border-radius: 0 0 5px 0;
            background: #35233f;
            transform: rotate(45deg);
        }
        .speech-girl {
            color: #ffe6f3;
            background: #43263df5;
            border-color: #eba4cc6b;
            border-radius: 23px 23px 8px 23px;
            box-shadow: 0 0 28px #e877b314, inset 0 1px #ffffff08;
            transform: translate(-32%, 10px) scale(0.94);
            transform-origin: 32% 100%;
        }
        .speech-girl::after { left: 28%; background: #43263d; border-color: #eba4cc6b; }
        .speech.is-visible { opacity: 1; visibility: visible; transform: translate(-68%, 0) scale(1); }
        .speech-girl.is-visible { transform: translate(-32%, 0) scale(1); }
        .speech span { position: relative; z-index: 1; }
        .speech .hello { font-weight: 600; color: #d8b8ff; }

        .meeting-heart {
            position: absolute;
            left: 50%;
            bottom: calc(18% + clamp(110px, 17.6vw, 156px));
            width: 24px;
            height: 24px;
            opacity: 0;
            transform: translate(-50%, 12px) scale(0.5);
            transition: opacity 0.8s ease, transform 0.8s ease;
            filter: drop-shadow(0 0 12px #f6a7c67d);
        }
        .meeting-heart.is-visible { opacity: 1; transform: translate(-50%, 0) scale(1); }
        @keyframes meet-walk {
            from { transform: translateX(var(--entry-x)); }
            to { transform: translateX(var(--target-x)); }
        }
        @keyframes step {
            0%, 100% { transform: rotate(-12deg); }
            50% { transform: rotate(12deg); }
        }
        @keyframes arm-swing {
            0%, 100% { transform: rotate(10deg); }
            50% { transform: rotate(-10deg); }
        }
        @keyframes walk-bob {
            0%, 50%, 100% { transform: translateY(0); }
            25%, 75% { transform: translateY(-4px); }
        }
        @keyframes soft-blink {
            0%, 42%, 47%, 100% { transform: scaleY(1); }
            44%, 45% { transform: scaleY(0.1); }
        }
        @keyframes gentle-breathe {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-2px); }
        }
        @media (max-width: 600px) {
            .speech { padding: 13px 15px; bottom: calc(100% + 96px); transform: translate(-50%, 10px) scale(0.94); }
            .speech.is-visible { transform: translate(-50%, 0) scale(1); }
            .speech::after { left: calc(50% - 9px); }
            .speech-girl { bottom: calc(100% + 17px); }
        }
        @media (max-height: 450px) {
            .meeting-title { top: 15px; font-size: 20px; }
            .meeting-title::after { margin-top: 5px; }
            .walker { width: 86px; bottom: 8%; }
            .meeting-ground { bottom: 8%; }
            .meeting-heart { bottom: calc(8% + 106px); }
        }
        @media (max-height: 450px) and (min-width: 601px) {
            .speech { bottom: calc(100% + 15px); font-size: 14px; padding: 12px 18px; }
        }
        @media (prefers-reduced-motion: reduce) {
            #meeting-scene, .speech, .meeting-heart { transition: none; }
            .is-active .walker { animation: none; transform: translateX(var(--target-x)); }
            .is-active .character, .is-active .leg, .is-active .arm, .character-eyes { animation: none !important; }
        }

        #memory-scene {
            position: fixed;
            inset: 0;
            z-index: 7;
            display: grid;
            grid-template-rows: auto minmax(0, 1fr) auto;
            gap: clamp(18px, 3vh, 32px);
            box-sizing: border-box;
            padding: clamp(28px, 5vh, 52px) 26px clamp(24px, 4vh, 40px);
            overflow: auto;
            color: #f6ddeb;
            background: radial-gradient(ellipse at 50% 55%, #ac6b9d21, transparent 67%);
            cursor: default;
            opacity: 0;
            transition: opacity 1s ease;
        }
        #memory-scene[hidden] { display: none; }
        #memory-scene.is-active { opacity: 1; }
        #memory-scene.is-leaving { opacity: 0; pointer-events: none; }
        .memory-heading { text-align: center; }
        .memory-heading h2 {
            margin: 0;
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
            font-size: clamp(22px, 3vw, 32px);
            line-height: 1.5;
            font-weight: 500;
            letter-spacing: 0.07em;
            text-shadow: 0 0 25px #dc9ac53d;
        }
        .memory-heading p {
            margin: 10px 0 0;
            color: #d1b7c9;
            font-size: clamp(13px, 1.5vw, 15px);
            line-height: 1.7;
            letter-spacing: 0.06em;
        }
        .memory-heading em { color: #edc6dd; font: italic 1.2em Georgia, serif; }
        .memory-gallery {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            align-items: center;
            justify-items: center;
            gap: clamp(16px, 2.4vw, 30px);
            width: min(100%, 1000px);
            min-height: 0;
            margin: auto;
        }
        .photo-card {
            --tilt: -4deg;
            --lift: 0px;
            --delay: 0.35s;
            position: relative;
            display: grid;
            grid-template-rows: minmax(0, 1fr) auto;
            gap: 10px;
            box-sizing: border-box;
            width: 100%;
            aspect-ratio: 0.69;
            max-height: min(43svh, 350px);
            min-height: 0;
            padding: 9px 9px 14px;
            border: 1px solid #f9e6f0;
            border-radius: 3px;
            background: #f6edf2;
            color: #654d60;
            box-shadow: 0 18px 42px #00000066, 0 0 30px #cf8cbf0d;
            cursor: zoom-in;
            opacity: 0;
            transform: translateY(30px) rotate(0deg) scale(0.94);
            -webkit-tap-highlight-color: transparent;
        }
        .photo-card:nth-child(2) { --tilt: 3.5deg; --lift: 20px; --delay: 1.05s; }
        .photo-card:nth-child(3) { --tilt: -2.5deg; --lift: -6px; --delay: 1.75s; }
        .photo-card:nth-child(4) { --tilt: 4.5deg; --lift: 16px; --delay: 2.45s; }
        .photo-card::before {
            content: "";
            position: absolute;
            left: 50%;
            top: -8px;
            width: 46px;
            height: 17px;
            border: 1px solid #f3dbe55c;
            background: #d6aac4b0;
            transform: translateX(-50%) rotate(-4deg);
            pointer-events: none;
        }
        .photo-card img {
            display: block;
            width: 100%;
            height: 100%;
            min-height: 0;
            object-fit: contain;
            border-radius: 1px;
            background: #f6edf2;
        }
        .photo-caption {
            display: flex;
            align-items: baseline;
            justify-content: center;
            gap: 8px;
            min-width: 0;
            font-size: clamp(10px, 1.2vw, 12px);
            line-height: 1.35;
            letter-spacing: 0.04em;
            white-space: nowrap;
        }
        .photo-caption small { font: italic 11px Georgia, serif; color: #aa8a9f; }
        .is-active .photo-card { animation: photo-arrives 1s cubic-bezier(0.22, 1, 0.36, 1) var(--delay) both; }
        .photo-card:focus-visible { outline: 2px solid #f4bcdd; outline-offset: 7px; }
        .memory-footer { text-align: center; }
        .memory-hint {
            margin: 0 0 15px;
            color: #b99bac;
            font-size: 11px;
            line-height: 1.6;
            letter-spacing: 0.1em;
        }
        #memory-continue {
            padding: 12px 24px;
            border: 1px solid #d4a4c85e;
            border-radius: 999px;
            color: #f5dcef;
            background: #8d4c7a29;
            font: inherit;
            font-size: 13px;
            letter-spacing: 0.07em;
            cursor: pointer;
            transition: background 0.2s ease;
        }
        #memory-continue:hover { background: #ad619745; }
        #memory-continue:focus-visible { outline: 2px solid #f4bcdd; outline-offset: 4px; }
        #memory-continue:disabled { cursor: default; }
        .is-active .memory-footer { animation: memory-fade-in 0.8s ease 3.1s both; }
        #memory-lightbox {
            width: min(92vw, 760px);
            max-width: none;
            max-height: 94svh;
            box-sizing: border-box;
            padding: 49px 42px 22px;
            border: 1px solid #dca5cd70;
            border-radius: 18px;
            background: #1d1221;
            color: #f6ddeb;
            box-shadow: 0 20px 100px #000000b3;
        }
        #memory-lightbox::backdrop { background: #09040dd9; backdrop-filter: blur(10px); }
        #memory-lightbox figure { margin: 0; }
        #lightbox-photo { display: block; width: auto; height: auto; max-width: 100%; max-height: calc(88svh - 112px); margin: 0 auto; object-fit: contain; border-radius: 4px; }
        #lightbox-caption { margin-top: 15px; text-align: center; font-size: 12px; line-height: 1.6; letter-spacing: 0.06em; }
        .lightbox-control {
            position: absolute;
            display: grid;
            place-items: center;
            width: 34px;
            height: 34px;
            padding: 0;
            border: 1px solid #d4a4c840;
            border-radius: 50%;
            background: #623b5733;
            color: #f7dfef;
            font: 22px Arial, sans-serif;
            cursor: pointer;
        }
        .lightbox-control:focus-visible { outline: 2px solid #f4bcdd; outline-offset: 3px; }
        #lightbox-close { right: 12px; top: 9px; }
        #lightbox-prev { left: 5px; top: calc(50% - 17px); }
        #lightbox-next { right: 5px; top: calc(50% - 17px); }
        @keyframes photo-arrives {
            to { opacity: 1; transform: translateY(var(--lift)) rotate(var(--tilt)) scale(1); }
        }
        @keyframes memory-fade-in { from { opacity: 0; } to { opacity: 1; } }
        @media (max-width: 760px) {
            #memory-scene { gap: 18px; padding: 27px 22px 24px; }
            .memory-gallery { width: min(100%, 350px); height: 100%; max-height: 480px; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-rows: repeat(2, minmax(0, 1fr)); gap: 22px 20px; }
            .photo-card { width: min(100%, 160px, calc((100svh - 250px) * 0.34)); max-height: 100%; padding: 7px 7px 10px; gap: 8px; }
            .photo-card:nth-child(2) { --lift: 6px; }
            .photo-card:nth-child(3) { --lift: 0px; }
            .photo-card:nth-child(4) { --lift: 6px; }
            .photo-caption { gap: 5px; font-size: 10px; letter-spacing: 0; }
            .photo-caption small { font-size: 9px; }
            .photo-card::before { width: 35px; height: 13px; top: -6px; }
            .memory-hint { margin-bottom: 12px; }
        }
        @media (max-height: 500px) and (min-width: 761px) {
            #memory-scene { padding: 15px 26px 16px; gap: 10px; }
            .memory-heading h2 { font-size: 21px; }
            .memory-heading p { margin-top: 2px; font-size: 12px; }
            .photo-card { max-height: 44svh; padding: 6px 6px 8px; gap: 5px; }
            .memory-hint { display: none; }
            #memory-continue { padding: 9px 20px; }
        }
        @media (prefers-reduced-motion: reduce) {
            #memory-scene { transition: none; }
            .is-active .photo-card { animation: none; opacity: 1; transform: translateY(var(--lift)) rotate(var(--tilt)); }
            .is-active .memory-footer { animation: none; }
        }
    </style>
</head>

<body>

<p id="intro-message">此片来浅浅记录<br>我们的第一个月吧</p>
<section id="meeting-scene" aria-label="两个人从不同的地方走来，相遇后开始聊天" hidden>
    <h2 class="meeting-title">故事的开始<span>belike...</span></h2>
    <div class="meeting-glow" aria-hidden="true"></div>
    <div class="meeting-ground" aria-hidden="true"></div>

    <div class="walker walker-boy">
        <p class="speech speech-boy" aria-hidden="true"><span class="hello">hiii</span><br><span>一起打羽毛球吗？</span></p>
        <div class="character-shadow" aria-hidden="true"></div>
        <svg class="character" viewBox="0 0 160 220" role="img" aria-label="紫色星星卫衣的Q版男生">
            <defs>
                <linearGradient id="boy-sweater" x2="0.35" y2="1"><stop stop-color="#b19ae0"/><stop offset="1" stop-color="#7761a5"/></linearGradient>
                <linearGradient id="boy-hair" x2="0.7" y2="1"><stop stop-color="#70588e"/><stop offset="1" stop-color="#352440"/></linearGradient>
                <linearGradient id="boy-face" x2="0.2" y2="1"><stop stop-color="#fff0ef"/><stop offset="1" stop-color="#f4c8dc"/></linearGradient>
            </defs>
            <g stroke="#382640" stroke-width="2.4" stroke-linejoin="round">
                <g class="leg leg-back">
                    <path d="M82 165Q95 162 99 174L99 201H80Z" fill="#67547f"/>
                    <path d="M81 195H98Q111 199 111 207Q111 213 100 213H78Q73 205 81 195Z" fill="#d4c4ed"/>
                    <path d="M82 208H106" fill="none" stroke="#f4e9ff" stroke-width="3" stroke-linecap="round"/>
                </g>
                <g class="leg leg-front">
                    <path d="M60 166H81L79 200H58Z" fill="#8c75a6"/>
                    <path d="M58 195H77Q88 200 86 208Q85 213 75 213H52Q48 204 58 195Z" fill="#e9dafa"/>
                    <path d="M54 208H81" fill="none" stroke="#fff0ff" stroke-width="3" stroke-linecap="round"/>
                </g>
                <g class="arm arm-back">
                    <path d="M104 129Q119 124 125 139L129 158Q126 169 116 166L107 152Z" fill="#8770b1"/>
                    <ellipse cx="124" cy="164" rx="8" ry="9" fill="#f6d2e3"/>
                </g>
                <path d="M56 123Q79 114 104 123Q114 143 110 174Q81 186 49 174Q45 147 56 123Z" fill="url(#boy-sweater)"/>
                <path d="M57 124Q79 141 104 124L98 118H65Z" fill="#cbb6f1"/>
                <path d="M68 131L67 146M92 131L94 146" fill="none" stroke="#ecdbff" stroke-width="3" stroke-linecap="round"/>
                <path d="M66 159Q79 164 95 159L93 171H66Z" fill="#9b82c7" stroke="#79619e" stroke-width="1.5"/>
                <path d="M98 141L100 145 105 146 101 149 101 154 97 151 93 153 94 148 91 145 96 145Z" fill="#f6e1ff" stroke="none"/>
                <g class="arm arm-front">
                    <path d="M55 130Q40 125 35 141L31 159Q34 169 44 166L53 152 63 135Z" fill="#b39bdf"/>
                    <ellipse cx="36" cy="165" rx="8" ry="9" fill="#ffe0eb"/>
                    <path d="M31 155L46 160" fill="none" stroke="#d8c5f4" stroke-width="5"/>
                </g>
                <path d="M22 66Q16 39 36 29Q31 12 48 20Q61 7 77 19Q92 6 104 23Q125 14 130 35Q145 40 138 68L131 94 28 95Z" fill="url(#boy-hair)" stroke="#a38ac4"/>
                <ellipse cx="29" cy="89" rx="10" ry="13" fill="#edbfd4" stroke="#c591ad"/>
                <ellipse cx="131" cy="89" rx="10" ry="13" fill="#edbfd4" stroke="#c591ad"/>
                <path d="M29 67Q30 40 80 40Q130 40 132 68L129 98Q123 126 81 128Q39 126 31 100Z" fill="url(#boy-face)" stroke="#b98bab"/>
                <path d="M23 72Q19 46 41 32Q61 20 82 27Q113 22 135 49L134 79 122 67Q115 68 110 57Q102 67 91 58L81 46Q68 67 54 60Q43 76 29 70L28 83Z" fill="url(#boy-hair)" stroke="#9d82b9"/>
                <path d="M37 45Q50 35 63 38M80 31Q95 29 107 38" fill="none" stroke="#b69cda" stroke-width="4" stroke-linecap="round" opacity="0.65"/>

<button id="start-btn">点击开始</button>

<audio id="bgm" preload="auto" playsinline></audio>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

<script>
    const MUSIC_URL = './M500000XeCbZ1UUyUY.mp3';
    const INTRO_SECONDS = 20;
    const PARTICLE_COUNT = 4200;
    const SPHERE_RADIUS = 15;

    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(
        75,
        window.innerWidth / window.innerHeight,
        0.1,
        1000
    );
    camera.position.z = 42;

    const renderer = new THREE.WebGLRenderer({
        antialias: true,
        alpha: true
    });

    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.body.appendChild(renderer.domElement);

    const bgm = document.getElementById('bgm');
    bgm.src = MUSIC_URL;
    bgm.crossOrigin = 'anonymous';

    let audioContext;
    let analyser;
    let frequencyData;
    let mediaSource;

    let musicEnergy = 0;
    let bassEnergy = 0;
    let trebleEnergy = 0;

    function initAudioAnalyzer() {
        if (audioContext) return;

        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        mediaSource = audioContext.createMediaElementSource(bgm);

        analyser = audioContext.createAnalyser();
        analyser.fftSize = 256;

        frequencyData = new Uint8Array(analyser.frequencyBinCount);

        mediaSource.connect(analyser);
        analyser.connect(audioContext.destination);
    }

    function updateMusicData() {
        if (!analyser) return;

        analyser.getByteFrequencyData(frequencyData);

        let total = 0;
        let bass = 0;
        let treble = 0;

        for (let i = 0; i < frequencyData.length; i++) {
            const value = frequencyData[i] / 255;
            total += value;

            if (i < 10) {
                bass += value;
            }

            if (i > 55) {
                treble += value;
            }
        }

        musicEnergy = total / frequencyData.length;
        bassEnergy = bass / 10;
        trebleEnergy = treble / 25;
    }

    const starGeometry = new THREE.BufferGeometry();
    const starCount = 1000;
    const starPositions = new Float32Array(starCount * 3);

    for (let i = 0; i < starCount; i++) {
        starPositions[i * 3] = (Math.random() - 0.5) * 140;
        starPositions[i * 3 + 1] = (Math.random() - 0.5) * 90;
        starPositions[i * 3 + 2] = (Math.random() - 0.5) * 140;
    }

    starGeometry.setAttribute(
        'position',
        new THREE.BufferAttribute(starPositions, 3)
    );

    const starMaterial = new THREE.PointsMaterial({
        size: 0.08,
        color: 0xffffff,
        transparent: true,
        opacity: 0.5
    });

    const stars = new THREE.Points(starGeometry, starMaterial);
    scene.add(stars);

    function heart2D(t) {
        const x = 16 * Math.pow(Math.sin(t), 3);
        const y =
            13 * Math.cos(t) -
            5 * Math.cos(2 * t) -
            2 * Math.cos(3 * t) -
            Math.cos(4 * t);

        return new THREE.Vector3(x, y, 0);
    }

    function getHeartParticlePoint() {
        const t = Math.random() * Math.PI * 2;
        const fill = 0.45 + Math.pow(Math.random(), 0.55) * 0.65;
        const p = heart2D(t);

        p.x *= 1.35 * fill;
        p.y *= 1.35 * fill;
        p.z = (Math.random() - 0.5) * 13;

        p.x += (Math.random() - 0.5) * 1.4;
        p.y += (Math.random() - 0.5) * 1.4;
        p.z += (Math.random() - 0.5) * 1.4;

        return p;
    }

    function createLoveYouPixelPool() {
        const canvas = document.createElement('canvas');
        const width = 900;
        const height = 360;
        const gap = 4;

        canvas.width = width;
        canvas.height = height;

        const ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, width, height);
        ctx.fillStyle = '#ffffff';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.font = '900 132px Arial, sans-serif';
        ctx.fillText('LOVE', width / 2, height * 0.34);
        ctx.fillText('YOU', width / 2, height * 0.72);

        const pixels = [];
        const data = ctx.getImageData(0, 0, width, height).data;

        for (let y = 0; y < height; y += gap) {
            for (let x = 0; x < width; x += gap) {
                const alpha = data[(y * width + x) * 4 + 3];

                if (alpha > 40) {
                    pixels.push({ x, y });
                }
            }
        }

        return { pixels, width, height };
    }

    const loveYouPixelPool = createLoveYouPixelPool();

    function getLoveYouParticlePoint() {
        const pool = loveYouPixelPool;
        const pixel = pool.pixels[Math.floor(Math.random() * pool.pixels.length)];
        const scale = 0.045;

        return new THREE.Vector3(
            (pixel.x - pool.width / 2) * scale + (Math.random() - 0.5) * 0.34,
            (pool.height / 2 - pixel.y) * scale - 1.2 + (Math.random() - 0.5) * 0.34,
            (Math.random() - 0.5) * 5.5
        );
    }

    const particleGeometry = new THREE.BufferGeometry();
    const positions = new Float32Array(PARTICLE_COUNT * 3);
    const colors = new Float32Array(PARTICLE_COUNT * 3);

    const spherePoints = [];
    const heartPoints = [];
    const loveYouPoints = [];
    const currentPoints = [];

    for (let i = 0; i < PARTICLE_COUNT; i++) {
        const phi = Math.acos(-1 + (2 * i) / PARTICLE_COUNT);
        const theta = Math.sqrt(PARTICLE_COUNT * Math.PI) * phi;
        const r = SPHERE_RADIUS;

        const sx = r * Math.cos(theta) * Math.sin(phi);
        const sy = r * Math.sin(theta) * Math.sin(phi);
        const sz = r * Math.cos(phi);

        spherePoints.push(new THREE.Vector3(sx, sy, sz));
        heartPoints.push(getHeartParticlePoint());
        loveYouPoints.push(getLoveYouParticlePoint());

        const startX = (Math.random() - 0.5) * 1;
        const startY = (Math.random() - 0.5) * 1;
        const startZ = (Math.random() - 0.5) * 1;

        currentPoints.push({
            x: startX,
            y: startY,
            z: startZ
        });

        positions[i * 3] = startX;
        positions[i * 3 + 1] = startY;
        positions[i * 3 + 2] = startZ;

        colors[i * 3] = 1.0;
        colors[i * 3 + 1] = Math.random() * 0.25;
        colors[i * 3 + 2] = 0.45 + Math.random() * 0.45;
    }

    particleGeometry.setAttribute(
        'position',
        new THREE.BufferAttribute(positions, 3)
    );

    particleGeometry.setAttribute(
        'color',
        new THREE.BufferAttribute(colors, 3)
    );

    const particleMaterial = new THREE.PointsMaterial({
        size: 0.38,
        vertexColors: true,
        transparent: true,
        opacity: 0.88,
        blending: THREE.AdditiveBlending,
        depthWrite: false
    });

    const particles = new THREE.Points(particleGeometry, particleMaterial);
    particles.visible = false;
    scene.add(particles);

    let state = 'waiting';
    let hasFormedSphere = false;

    const introMessage = document.getElementById('intro-message');
    const textTip = document.getElementById('text-tip');
    const startBtn = document.getElementById('start-btn');
    const meetingScene = document.getElementById('meeting-scene');
    const boySpeech = meetingScene.querySelector('.speech-boy');
    const girlSpeech = meetingScene.querySelector('.speech-girl');
    const meetingHeart = meetingScene.querySelector('.meeting-heart');

    const memoryScene = document.getElementById('memory-scene');
    const memoryContinue = document.getElementById('memory-continue');
    const memoryCards = Array.from(memoryScene.querySelectorAll('.photo-card'));
    const memoryLightbox = document.getElementById('memory-lightbox');
    const lightboxPhoto = document.getElementById('lightbox-photo');
    const lightboxCaption = document.getElementById('lightbox-caption');
    let selectedMemoryPhoto = 0;

    function startMemoryScene() {
        state = 'memories';
        meetingScene.hidden = true;
        introMessage.hidden = true;
        memoryScene.hidden = false;
        textTip.innerText = '';
        memoryScene.getBoundingClientRect();
        memoryScene.classList.add('is-active');
    }

    function showMemoryPhoto(index) {
        selectedMemoryPhoto = (index + memoryCards.length) % memoryCards.length;
        const card = memoryCards[selectedMemoryPhoto];
        const photo = card.querySelector('img');
        lightboxPhoto.src = photo.src;
        lightboxPhoto.alt = photo.alt;
        lightboxCaption.textContent = (selectedMemoryPhoto + 1) + ' / ' + memoryCards.length + ' · ' + card.querySelector('.photo-caption').textContent.replace(/^\s*\d+\s*/, '').trim();
    }

    memoryCards.forEach(function (card, index) {
        card.addEventListener('click', function (event) {
            event.stopPropagation();
            showMemoryPhoto(index);
            memoryLightbox.showModal();
        });
    });

    document.getElementById('lightbox-close').addEventListener('click', function () {
        memoryLightbox.close();
    });
    document.getElementById('lightbox-prev').addEventListener('click', function () {
        showMemoryPhoto(selectedMemoryPhoto - 1);
    });
    document.getElementById('lightbox-next').addEventListener('click', function () {
        showMemoryPhoto(selectedMemoryPhoto + 1);
    });
    memoryLightbox.addEventListener('click', function (event) {
        if (event.target === memoryLightbox) memoryLightbox.close();
    });
    memoryLightbox.addEventListener('keydown', function (event) {
        if (event.key === 'ArrowLeft') {
            event.preventDefault();
            showMemoryPhoto(selectedMemoryPhoto - 1);
        } else if (event.key === 'ArrowRight') {
            event.preventDefault();
            showMemoryPhoto(selectedMemoryPhoto + 1);
        }
    });
    memoryContinue.addEventListener('click', function (event) {
        event.stopPropagation();
        if (state !== 'memories') return;
        state = 'leavingMemories';
        memoryContinue.disabled = true;
        memoryScene.classList.add('is-leaving');
        gsap.delayedCall(1, formSphere);
    });

    function showSpeech(bubble) {
        bubble.classList.add('is-visible');
        bubble.setAttribute('aria-hidden', 'false');
    }

    function playIntroStory() {
        const titleFadeAt = 4.2;
        const meetingStartsAt = 5.4;
        const walkingSeconds = 3.8;

        // The opening sentence, meeting and conversation share the original music intro.
        gsap.timeline()
            .call(function () {
                introMessage.classList.add('is-leaving');
            }, [], titleFadeAt)
            .call(function () {
                introMessage.hidden = true;
                meetingScene.hidden = false;
                meetingScene.classList.add('is-active');
            }, [], meetingStartsAt)
            .call(function () {
                meetingScene.classList.add('has-met');
            }, [], meetingStartsAt + walkingSeconds)
            .call(function () {
                showSpeech(boySpeech);
            }, [], 9.8)
            .call(function () {
                showSpeech(girlSpeech);
            }, [], 12.6)
            .call(function () {
                meetingHeart.classList.add('is-visible');
            }, [], 14)
            .call(function () {
                meetingScene.classList.add('is-leaving');
            }, [], INTRO_SECONDS - 1)
            .call(startMemoryScene, [], INTRO_SECONDS);
    }

    bgm.addEventListener('error', function () {
        if (state === 'waiting') {
            textTip.innerText = '没有找到音乐文件：请把 M500000XeCbZ1UUyUY.mp3 和这个 HTML 放在 GitHub 同一目录';
        }
    });

    startBtn.addEventListener('click', async function (event) {
        event.stopPropagation();

        startBtn.disabled = true;
        startBtn.innerText = '正在加载...';
        textTip.innerText = '正在加载音乐...';

        initAudioAnalyzer();

        try {
            await audioContext.resume();
            bgm.currentTime = 0;
            await bgm.play();
        } catch (e) {
            startBtn.disabled = false;
            startBtn.innerText = '再点一次';
            textTip.innerText = '音乐播放失败。请确认 mp3 已上传到 GitHub，并且路径就是 ./M500000XeCbZ1UUyUY.mp3';
            return;
        }

        startBtn.style.display = 'none';
        textTip.innerText = '';

        state = 'intro';
        hasFormedSphere = false;

        particles.visible = false;
        playIntroStory();
    });

    function formSphere() {
        if (hasFormedSphere) return;

        hasFormedSphere = true;
        state = 'formingSphere';
        memoryScene.hidden = true;
        introMessage.hidden = true;
        meetingScene.hidden = true;
        particles.visible = true;

        for (let i = 0; i < PARTICLE_COUNT; i++) {
            currentPoints[i].x = (Math.random() - 0.5) * 1.5;
            currentPoints[i].y = (Math.random() - 0.5) * 1.5;
            currentPoints[i].z = (Math.random() - 0.5) * 1.5;

            gsap.to(currentPoints[i], {
                x: spherePoints[i].x,
                y: spherePoints[i].y,
                z: spherePoints[i].z,
                duration: 1.8 + Math.random() * 1.2,
                ease: "power3.out"
            });
        }

        gsap.delayedCall(3, function () {
            state = 'sphere';
            textTip.innerText = '点我宝宝';
        });
    }

    function explodeToShape(targetShape, nextState) {
        if (state !== 'sphere' && state !== 'heart' && state !== 'loveText') return;

        state = 'animating';
        textTip.style.opacity = '0';

        for (let i = 0; i < PARTICLE_COUNT; i++) {
            const explodePower = 1.4 + Math.random() * 1.8;

            gsap.to(currentPoints[i], {
                x: currentPoints[i].x * explodePower,
                y: currentPoints[i].y * explodePower,
                z: currentPoints[i].z * explodePower,
                duration: 0.35,
                ease: "power2.out",
                onComplete: function () {
                    gsap.to(currentPoints[i], {
                        x: targetShape[i].x,
                        y: targetShape[i].y,
                        z: targetShape[i].z,
                        duration: 1.6 + Math.random() * 1.5,
                        ease: "elastic.out(1, 0.42)"
                    });
                }
            });
        }

        if (nextState === 'heart' || nextState === 'loveText') {
            gsap.to(particles.rotation, {
                x: 0,
                y: 0,
                z: 0,
                duration: 2,
                ease: "power2.inOut"
            });
        }

        setTimeout(function () {
            state = nextState;

            if (state === 'heart') {
                textTip.innerText = '点我宝宝';
            } else {
                textTip.innerText = '点我宝宝';
            }

            textTip.style.opacity = '1';
        }, 2300);
    }

    window.addEventListener('click', function () {
        if (state === 'sphere') {
            const showHeart = Math.random() < 0.5;
            explodeToShape(showHeart ? heartPoints : loveYouPoints, showHeart ? 'heart' : 'loveText');
        } else if (state === 'heart' || state === 'loveText') {
            explodeToShape(spherePoints, 'sphere');
        }
    });

    function animate() {
        requestAnimationFrame(animate);

        updateMusicData();

        stars.rotation.y += 0.0008 + bassEnergy * 0.002;
        stars.rotation.x += 0.0003;

        if (particles.visible) {
            const positionsArray = particleGeometry.attributes.position.array;

            for (let i = 0; i < PARTICLE_COUNT; i++) {
                positionsArray[i * 3] = currentPoints[i].x;
                positionsArray[i * 3 + 1] = currentPoints[i].y;
                positionsArray[i * 3 + 2] = currentPoints[i].z;
            }

            particleGeometry.attributes.position.needsUpdate = true;

            const pulse = bassEnergy * 0.01;

            if (state === 'loveText') {
                particles.rotation.x += (0 - particles.rotation.x) * 0.05;
                particles.rotation.y += (0 - particles.rotation.y) * 0.05;
                particles.rotation.z += (0 - particles.rotation.z) * 0.05;
            } else {
                particles.rotation.y += 0.003 + pulse;
                particles.rotation.z += 0.001 + pulse * 0.5;
            }
        }

        renderer.render(scene, camera);
    }

    animate();

    window.addEventListener('resize', function () {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
</script>

</body>
</html>
